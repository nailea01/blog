<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Blog</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;

    background:#FADADD;

    font-family:Arial, Helvetica, sans-serif;

    color:#333;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding-top:40px;

}



/* Imagen decorativa */

.decoracion{

    position:absolute;

    width:130px;

    bottom:50px;

    right:250px;

}



/* Contenedor */

.container{

    display:flex;

    gap:10px;

    width:100%;

    max-width:1000px;

}



/* Panel izquierdo */

.sidebar{

    width:140px;

    height:490px;

    padding:8px;

    background:white;

    background-image:url("https://foollovers.com/mat/dot/n17-bg-polkadot.gif");

    border-radius:3px;

}



/* Foto */

.profile{

    width:100%;

    height:120px;

    background-image:url("https://hanniballs.neocities.org/images/assets/rila.jpg");

    background-size:cover;

    background-position:center;

    border-radius:3px;

}



/* Botones */

.nav-btn{

    width:100%;

    margin-top:12px;

    padding:12px;

    border:none;

    border-radius:8px;

    background:white;

    color:#333;

    font-size:16px;

    cursor:pointer;

    transition:.3s;

}


.nav-btn:hover{

    background:#ffd1e2;

}



/* Contenido */

.content{

    width:470px;

    height:490px;

    background:white;

    padding:20px;

    border-radius:3px;

}



/* Paginas */

.pagina{

    animation:entrada .3s;

}



.content h1{

    margin-bottom:15px;

}



.content p{

    line-height:1.8;

}



@keyframes entrada{

    from{

        opacity:0;

        transform:translateY(10px);

    }


    to{

        opacity:1;

        transform:translateY(0);

    }

}



/* Flecha del menú */

.menu-arrow{

    display:none;

}



/* ------------------------- */
/* VERSION CELULAR */
/* ------------------------- */


@media(max-width:700px){

    body{

        padding:20px;

        justify-content:center;

    }


    .container{

        width:100%;

        display:flex;

        justify-content:center;

        align-items:center;

    }


    .content{

        width:95%;

        max-width:470px;

        height:500px;

        margin:0 auto;

    }

}



/* Flecha */

.menu-arrow{


    display:flex;

    position:fixed;


    left:0;

    top:50%;


    transform:translateY(-50%);


    width:35px;

    height:60px;


    background:white;


    border-radius:0 15px 15px 0;


    justify-content:center;

    align-items:center;


    font-size:25px;


    cursor:pointer;


    z-index:20;


}



/* Panel escondido */

.sidebar{


    position:fixed;


    left:-160px;


    top:50%;


    transform:translateY(-50%);


    width:140px;


    height:490px;


    z-index:15;


    transition:.4s;


}



/* Panel abierto */

.sidebar.activo{


    left:10px;


}



/* Contenido */

.content{


    width:95%;

    height:500px;


}



/* Ocultar decoración */

.decoracion{

    display:none;

}



}

</style>

</head>



<body>


<img class="decoracion"
src="https://64.media.tumblr.com/7c02e4cf3a50898d41afec0a448b77b3/b5db4e9ead4a7e5a-23/s640x960/bdd745ed4687ba56f5e3d26b2f983b44a080f986.pnj">



<div class="menu-arrow" onclick="abrirMenu()">
    ➜
</div>



<div class="container">



<aside class="sidebar" id="menu">


    <div class="profile"></div>


    <button class="nav-btn" onclick="mostrar('sobre')">
        Sobre mí
    </button>


    <button class="nav-btn" onclick="mostrar('articulos')">
        Artículos
    </button>


    <button class="nav-btn" onclick="mostrar('fotos')">
        Fotos
    </button>


    <button class="nav-btn" onclick="mostrar('notas')">
        Notas
    </button>


</aside>





<main class="content">


    <div id="sobre" class="pagina">

        <h1>Sobre mí</h1>

        <p>
        Escribe aquí tu presentación, información personal o cualquier cosa que quieras compartir.
        </p>

    </div>




    <div id="articulos" class="pagina" style="display:none;">

        <h1>Artículos</h1>

        <p>
        Aquí puedes poner tus publicaciones o textos largos.
        </p>

    </div>




    <div id="fotos" class="pagina" style="display:none;">

        <h1>Fotos</h1>

        <p>
        Aquí puedes agregar una galería de imágenes.
        </p>

    </div>




    <div id="notas" class="pagina" style="display:none;">

        <h1>Notas</h1>

        <p>
        Aquí puedes escribir pequeñas notas o ideas.
        </p>

    </div>


</main>


</div>




<script>


function mostrar(id){


    let paginas=document.querySelectorAll(".pagina");


    paginas.forEach(function(pagina){

        pagina.style.display="none";

    });



    document.getElementById(id).style.display="block";


}



function abrirMenu(){


    document.getElementById("menu").classList.toggle("activo");


}


</script>


</body>

</html>
